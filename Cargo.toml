[workspace]
resolver = "3"
members = ["dns_relay", "dns_relay_admin", "resolver_proxy", "shared"]

[workspace.package]
version = "1.6.10"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/v4g4b0nd-0x76/dns-hijacker"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

[profile.release-perf]
inherits = "release"
opt-level = 3
