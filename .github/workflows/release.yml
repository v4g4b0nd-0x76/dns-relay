name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})

    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'chore: release v')

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # dns_relay
          - name: dns-relay-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_arg: gnu
            bin: dns_relay
            asset: dns-relay-x86_64-unknown-linux-gnu

          - name: dns-relay-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build_arg: musl
            bin: dns_relay
            asset: dns-relay-x86_64-unknown-linux-musl
            musl: true

          - name: dns-relay-macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            build_arg: mac
            bin: dns_relay
            asset: dns-relay-aarch64-apple-darwin

          - name: dns-relay-windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build_arg: windows
            bin: dns_relay
            asset: dns-relay-x86_64-pc-windows-msvc
            windows: true

          # resolver_proxy
          - name: resolver-proxy-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_arg: gnu
            bin: resolver_proxy
            asset: resolver-proxy-x86_64-unknown-linux-gnu

          - name: resolver-proxy-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build_arg: musl
            bin: resolver_proxy
            asset: resolver-proxy-x86_64-unknown-linux-musl
            musl: true

          - name: resolver-proxy-macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            build_arg: mac
            bin: resolver_proxy
            asset: resolver-proxy-aarch64-apple-darwin

          - name: resolver-proxy-windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build_arg: windows
            bin: resolver_proxy
            asset: resolver-proxy-x86_64-pc-windows-msvc
            windows: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-${{ matrix.bin }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh "${{ matrix.build_arg }}" "${{ matrix.bin }}"

      - name: Package artifact
        if: "!matrix.windows"
        run: |
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"

          test -f "$src"

          cp "$src" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

          tar -czf \
            "${{ matrix.asset }}.tar.gz" \
            "${{ matrix.asset }}"

          shasum -a 256 \
            "${{ matrix.asset }}" \
            "${{ matrix.asset }}.tar.gz" \
            > "${{ matrix.asset }}.sha256"

      - name: Package Windows artifact
        if: matrix.windows
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe"

          if (!(Test-Path $src)) {
            throw "Missing release binary: $src"
          }

          Copy-Item $src "${{ matrix.bin }}.exe"

          Compress-Archive `
            -Path "${{ matrix.bin }}.exe" `
            -DestinationPath "${{ matrix.asset }}.zip"

          Get-FileHash `
            -Algorithm SHA256 `
            "${{ matrix.bin }}.exe", "${{ matrix.asset }}.zip" |
            ForEach-Object {
              "{0}  {1}" -f $_.Hash.ToLower(), $_.Path
            } |
            Set-Content "${{ matrix.asset }}.sha256"

      - name: Upload build artifact
        if: "!matrix.windows"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

      - name: Upload Windows build artifact
        if: matrix.windows
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.bin }}.exe
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  build-gui:
    name: build GUI (${{ matrix.name }})

    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'chore: release v')

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            gui/src-tauri -> target
          key: gui-${{ matrix.target }}

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: --target ${{ matrix.target }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: dns-relay-gui-[platform]-[arch]-[bundle]

  release:
    name: publish GitHub release

    needs:
      - build
      - build-gui

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          msg="${{ github.event.head_commit.message }}"

          tag="$(
            printf '%s\n' "$msg" |
              grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' |
              head -1 ||
              true
          )"

          if [[ -z "$tag" ]]; then
            ver="$(
              sed -n \
                's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' \
                Cargo.toml |
                head -1
            )"

            tag="v${ver}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release artifacts
        shell: bash
        run: find dist -type f -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
