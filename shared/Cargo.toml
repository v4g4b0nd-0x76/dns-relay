[package]
name = "dns-relay-shared"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal DNS packet, cache, policy, and logging support for dns_relay"

[dependencies]
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
    "std",
] }
tokio = { version = "1.52.3", default-features = false, features = [
    "io-util",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
socket2 = "0.5"
serde_json = "1.0.150"

aes-gcm = "0.10"
base64 = "0.21"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
rand = "0.10.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "std",
] }
lru = "0.12"
chacha20poly1305 = "0.10"
file-rotate = "0.8.0"
tracing-appender = "0.2.5"
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
